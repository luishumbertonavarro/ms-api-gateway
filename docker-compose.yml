# Infraestructura compartida de NUR-TRICENTER: Consul (Service Discovery), RabbitMQ (broker)
# y el API Gateway. Todos los microservicios se unen a la red externa nurtricenter_net.
#
#   Solo infraestructura:   docker compose up -d --build
#   Sistema completo:       ./scripts/levantar.ps1   (o docker compose -f docker-compose.sistema.yml up -d --build)
name: nurtricenter-infra

services:
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nurtricenter_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - nurtricenter_net

  gateway:
    build: .
    image: nurtricenter/api-gateway:1.0.0
    container_name: api-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceDiscovery__ConsulAddress: http://consul:8500
      ServiceDiscovery__Registro__Habilitado: "true"
      Jwt__Secret: ${JWT_SECRET:-nurtricenter-secreto-compartido-2026}
    ports:
      - "5000:8080"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - nurtricenter_net

networks:
  nurtricenter_net:
    external: true
